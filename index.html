<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Echo Maze is a kid-friendly text adventure where clever answers defeat Wardens and open the way home."
    />
    <meta name="theme-color" content="#f8f4df" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23d9e500'/%3E%3Cpath d='M16 14h32v8H24v8h16v20H16v-8h16v-4H16z' fill='%230d1b2a'/%3E%3C/svg%3E"
    />
    <title>Echo Maze</title>
  </head>
  <body>
    <div id="game-root"></div>
    <template id="game-template">
    <a class="skip-link" href="#labyrinth">Skip to the Labyrinth</a>

    <nav class="command-bar" aria-label="Game controls">
      <a class="wordmark" href="#" aria-label="Echo Maze home">Echo Maze</a>
      <h1 id="quest-headline">Choose a quest. Outsmart the Wardens.</h1>
      <div class="command-bar__actions">
        <button class="control-button" id="atlas-button" type="button">
          Atlas
        </button>
        <button class="control-button" id="records-button" type="button">
          Records
        </button>
        <button class="control-button" id="sound-toggle" type="button" aria-pressed="false">
          Sound off
        </button>
        <button class="primary-button" id="new-run" type="button">
          New Quest
        </button>
      </div>
    </nav>

    <main class="play-workbench">
      <section class="play-grid" aria-label="Echo Maze game">
        <aside class="status-deck" aria-label="Run status">
          <div class="player-console" aria-label="Player status">
            <button class="player-console__identity" id="player-button" type="button">
              <span class="player-swatch" aria-hidden="true"></span>
              <span>
                <small>Explorer</small>
                <strong id="player-name">Guest</strong>
              </span>
            </button>
            <dl class="player-score">
              <div>
                <dt>Score</dt>
                <dd id="player-score">0</dd>
              </div>
              <div>
                <dt>Global max</dt>
                <dd id="global-max-score">—</dd>
              </div>
            </dl>
            <button class="scoreboard-button" id="scoreboard-button" type="button">
              Top 10
            </button>
          </div>

          <div class="status-deck__heading">
            <span class="section-label" id="quest-level-name">Trail Scout</span>
            <span class="run-state" id="run-state">Exploring</span>
          </div>
          <p class="quest-stage" id="quest-stage">
            Labyrinth 1 of 20 · Foundation
          </p>

          <p
            class="quest-sync-status"
            id="quest-sync-status"
            data-state="local"
            role="status"
            aria-live="polite"
          >
            Device save
          </p>

          <dl class="run-metrics">
            <div>
              <dt>Time</dt>
              <dd id="time-value">00:00</dd>
            </div>
            <div>
              <dt>Moves</dt>
              <dd id="moves-value">000</dd>
            </div>
            <div>
              <dt>Echoes</dt>
              <dd id="echo-count">0 / 3</dd>
            </div>
            <div>
              <dt>Vitality</dt>
              <dd id="vitality-count">3 / 3</dd>
            </div>
          </dl>

          <div class="meter-row">
            <span>Echo signal</span>
            <div class="echo-meter" id="echo-meter" aria-hidden="true"></div>
          </div>
          <div class="meter-row">
            <span>Vitality</span>
            <div class="vitality-meter" id="vitality-meter" aria-hidden="true"></div>
          </div>

          <div class="warden-readout" id="warden-readout" data-mode="patrol">
            <span class="section-label">Warden mode</span>
            <strong id="warden-state">Patrol</strong>
            <p>Answer correctly to defeat it.</p>
          </div>
        </aside>

        <article class="labyrinth-panel" id="labyrinth">
          <div class="arena-bar">
            <button class="seed-copy" id="seed-copy" type="button">
              <span class="section-label">Seed</span>
              <strong id="seed-value"></strong>
              <span class="seed-copy__hint">Copy Share Link</span>
            </button>
            <button class="control-button" id="pause-run" type="button" aria-pressed="false">
              Pause
            </button>
          </div>

          <div class="canvas-frame" id="canvas-frame">
            <canvas
              id="maze-canvas"
              width="720"
              height="720"
              tabindex="0"
              aria-label="Interactive maze. Use arrow keys or WASD to move. Press Q or Space to use Pulse."
            ></canvas>
          </div>

          <div class="arena-actions">
            <div class="touch-controls" aria-label="Touch movement controls">
              <button class="direction-button direction-button--up" data-move="up" type="button">
                <span aria-hidden="true">&uarr;</span><span class="sr-only">Move up</span>
              </button>
              <button class="direction-button direction-button--left" data-move="left" type="button">
                <span aria-hidden="true">&larr;</span><span class="sr-only">Move left</span>
              </button>
              <button class="direction-button direction-button--down" data-move="down" type="button">
                <span aria-hidden="true">&darr;</span><span class="sr-only">Move down</span>
              </button>
              <button class="direction-button direction-button--right" data-move="right" type="button">
                <span aria-hidden="true">&rarr;</span><span class="sr-only">Move right</span>
              </button>
            </div>

            <button class="pulse-button" id="pulse-action" type="button">
              <span>
                <strong>Pulse</strong>
                <small>Reveal nearby tiles</small>
              </span>
              <kbd>Q</kbd>
              <span class="pulse-button__count" id="pulse-count">2</span>
            </button>
          </div>

          <div class="event-ribbon" id="event-ribbon" aria-hidden="true">
            Run ready.
          </div>
        </article>

        <aside class="intel-deck" aria-label="How to play">
          <div>
            <span class="section-label">Your quest</span>
            <p class="objective-copy">
              Recover every Echo. When a Warden finds you, solve its challenge
              to clear the path. Then reach the open Gate.
            </p>
          </div>

          <div class="story-panel">
            <span class="section-label">Adventure log</span>
            <ol class="story-log" id="story-log"></ol>
          </div>

          <div class="legend" aria-label="Maze legend">
            <span class="section-label">Map marks</span>
            <ul>
              <li><span class="legend-mark legend-mark--explorer"></span>Explorer</li>
              <li><span class="legend-mark legend-mark--echo"></span>Echo</li>
              <li><span class="legend-mark legend-mark--gate-locked"></span>Locked Gate</li>
              <li><span class="legend-mark legend-mark--gate-sealed"></span>Open, sealed Gate</li>
              <li><span class="legend-mark legend-mark--gate-open"></span>Open Gate</li>
              <li><span class="legend-mark legend-mark--warden"></span>Warden</li>
            </ul>
          </div>

          <p class="field-note" id="field-note">
            Explore with arrows or WASD. Your knowledge defeats Wardens.
          </p>
        </aside>
      </section>
    </main>

    <footer class="record-strip">
      <span class="record-strip__label">Run records</span>
      <p id="best-run">No finished run yet. Escape or defeat saves an attempt.</p>
    </footer>

    <p class="sr-only" id="live-region" aria-live="polite"></p>

    <dialog
      class="atlas-dialog"
      id="atlas-dialog"
      aria-labelledby="atlas-title"
      aria-describedby="atlas-progress atlas-legend"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">Quest Progress</span>
          <h2 id="atlas-title" tabindex="-1">Echo Atlas</h2>
        </div>
        <button class="control-button" id="atlas-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="atlas-progress"></p>
      <p class="atlas-legend" id="atlas-legend">
        Each numbered mark includes its state in text. Diamond marks are Gate Warden milestones.
      </p>
      <div class="atlas-regions" id="atlas-regions"></div>
    </dialog>

    <dialog class="level-dialog" id="level-dialog" aria-labelledby="level-title">
      <div class="level-dialog__intro">
        <span class="section-label">Start an adventure</span>
        <h2 id="level-title">Choose your Quest Level</h2>
        <p>Every path has a different maze and learning challenge. You can change levels whenever you start a new quest.</p>
      </div>
      <div class="level-cards" id="level-cards">
        <button class="level-card" type="button" data-level="bright-start">
          <span class="level-card__badge">Quest Level 1</span>
          <strong>Bright Start</strong>
          <span>Friendly foundations across 20 growing Labyrinths.</span>
          <span class="level-card__topics">Questions: sums to 20 · words · nature</span>
          <small>11–15 tiles · 2–4 Echoes · 1–3 Wardens</small>
        </button>
        <button class="level-card level-card--featured" type="button" data-level="trail-scout">
          <span class="level-card__badge">Quest Level 2</span>
          <strong>Trail Scout</strong>
          <span>Balanced reasoning across 20 expanding Labyrinths.</span>
          <span class="level-card__topics">Questions: times tables · reading clues · life science</span>
          <small>13–19 tiles · 3–6 Echoes · 2–4 Wardens</small>
        </button>
        <button class="level-card" type="button" data-level="maze-master">
          <span class="level-card__badge">Quest Level 3</span>
          <strong>Maze Master</strong>
          <span>Advanced mastery across 20 formidable Labyrinths.</span>
          <span class="level-card__topics">Questions: fractions · logic · earth and space</span>
          <small>15–23 tiles · 4–8 Echoes · 3–6 Wardens</small>
        </button>
      </div>
      <p class="level-dialog__note">No timer during questions. Take your time and think.</p>
    </dialog>

    <dialog
      class="quest-conflict-dialog"
      id="quest-conflict-dialog"
      aria-labelledby="quest-conflict-title"
      aria-describedby="quest-conflict-intro"
    >
      <span class="section-label">Quest continuity</span>
      <h2 id="quest-conflict-title" tabindex="-1">Choose which Quest to keep</h2>
      <p class="dialog-intro" id="quest-conflict-intro"></p>
      <div class="quest-conflict-options">
        <section class="quest-conflict-choice" id="quest-conflict-local"></section>
        <section class="quest-conflict-choice" id="quest-conflict-cloud"></section>
      </div>
      <div class="quest-conflict-dialog__actions">
        <button
          class="control-button"
          id="quest-conflict-use-local"
          type="button"
        >
          Keep this device
        </button>
        <button
          class="primary-button"
          id="quest-conflict-use-cloud"
          type="button"
        >
          Use Cloud Quest
        </button>
      </div>
    </dialog>

    <dialog
      class="challenge-dialog"
      id="challenge-dialog"
      aria-labelledby="challenge-title"
      aria-describedby="challenge-promise challenge-feedback challenge-question"
    >
      <div class="challenge-dialog__crest" aria-hidden="true">?</div>
      <span class="section-label" id="challenge-kicker">Warden challenge</span>
      <h2 id="challenge-title">A Warden blocks the path.</h2>
      <p class="challenge-dialog__promise" id="challenge-promise">Answer correctly and the Warden is defeated.</p>
      <div class="challenge-feedback" id="challenge-feedback" role="status">
        Think carefully. Your timer is paused.
      </div>
      <p
        class="challenge-question"
        id="challenge-question"
        tabindex="-1"
        aria-live="polite"
        aria-atomic="true"
      >Preparing your question…</p>
      <div class="challenge-support">
        <button
          class="control-button"
          id="hint-button"
          type="button"
          aria-expanded="false"
          aria-controls="question-hint"
        >
          Show Hint
        </button>
        <p class="question-hint" id="question-hint" aria-live="polite" hidden></p>
      </div>
      <div class="challenge-choices" id="challenge-choices"></div>
      <div class="challenge-skip">
        <button class="control-button" id="skip-question" type="button">
          Skip free
        </button>
        <div class="skip-warning" id="skip-warning" role="alert" hidden>
          <strong>Use Vitality?</strong>
          <p id="skip-warning-text">Skipping costs 1 Vitality.</p>
          <div class="skip-warning__actions">
            <button class="control-button" id="skip-cancel" type="button">
              Keep question
            </button>
            <button class="danger-button" id="skip-confirm" type="button">
              Use skip
            </button>
          </div>
        </div>
      </div>
      <p class="challenge-source" id="challenge-source">Opening the question scroll…</p>
    </dialog>

    <dialog class="records-dialog" id="records-dialog" aria-labelledby="records-title">
      <div class="dialog-heading">
        <div>
          <span class="section-label">Saved locally</span>
          <h2 id="records-title">Run Records</h2>
        </div>
        <button class="control-button" id="records-close" type="button">Close</button>
      </div>
      <p class="dialog-intro">
        Your five strongest finished attempts. Escapes rank first; defeats show
        Echo progress. Replay or share any seed.
      </p>
      <ol class="run-records" id="run-records"></ol>
    </dialog>

    <dialog class="player-dialog" id="player-dialog" aria-labelledby="player-dialog-title">
      <div class="dialog-heading">
        <div>
          <span class="section-label">Explorer profile</span>
          <h2 id="player-dialog-title">Make the maze yours.</h2>
        </div>
        <button class="control-button" id="player-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="player-dialog-intro">
        Sign in to save a username, colors, and escaped-run scores.
      </p>
      <div class="player-auth-row">
        <button class="primary-button" id="player-auth-button" type="button">
          Sign in
        </button>
        <button class="control-button" id="player-sign-out" type="button" hidden>
          Sign out
        </button>
      </div>
      <form class="player-form" id="player-form">
        <label class="player-field" for="player-username">
          <span>Username</span>
          <input
            id="player-username"
            name="username"
            type="text"
            minlength="3"
            maxlength="20"
            autocomplete="username"
            placeholder="Moss Runner"
            required
          />
          <small>3–20 letters, numbers, spaces, underscores, or hyphens.</small>
        </label>
        <fieldset class="palette-fieldset">
          <legend>Explorer color</legend>
          <div class="palette-options palette-options--explorer">
            <label><input type="radio" name="explorerPalette" value="teal" checked /><span data-palette="teal">Signal teal</span></label>
            <label><input type="radio" name="explorerPalette" value="sunset" /><span data-palette="sunset">Sunset coral</span></label>
            <label><input type="radio" name="explorerPalette" value="violet" /><span data-palette="violet">Quest violet</span></label>
            <label><input type="radio" name="explorerPalette" value="gold" /><span data-palette="gold">Lantern gold</span></label>
          </div>
        </fieldset>
        <fieldset class="palette-fieldset">
          <legend>Playground color</legend>
          <div class="palette-options palette-options--playground">
            <label><input type="radio" name="playgroundPalette" value="daylight" checked /><span data-palette="daylight">Daylight</span></label>
            <label><input type="radio" name="playgroundPalette" value="twilight" /><span data-palette="twilight">Twilight</span></label>
            <label><input type="radio" name="playgroundPalette" value="sea-glass" /><span data-palette="sea-glass">Sea glass</span></label>
            <label><input type="radio" name="playgroundPalette" value="dusk" /><span data-palette="dusk">Dusk</span></label>
          </div>
        </fieldset>
        <p class="player-form__status" id="player-form-status" role="status" aria-live="polite"></p>
        <button class="primary-button" id="player-save" type="submit">
          Save profile
        </button>
      </form>
    </dialog>

    <dialog
      class="scoreboard-dialog"
      id="scoreboard-dialog"
      aria-labelledby="scoreboard-title"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">All Explorers</span>
          <h2 id="scoreboard-title">Global Scoreboard</h2>
        </div>
        <button class="control-button" id="scoreboard-close" type="button">Close</button>
      </div>
      <p class="dialog-intro">
        Each Explorer’s best escaped run. Warden 100 · Echo 50 · Escape 500.
      </p>
      <p class="scoreboard-status" id="scoreboard-status" role="status" aria-live="polite">
        Loading scores…
      </p>
      <ol class="scoreboard-list" id="scoreboard-list"></ol>
    </dialog>

    <dialog
      class="lifetime-dialog"
      id="lifetime-dialog"
      aria-labelledby="lifetime-title"
      aria-describedby="lifetime-intro lifetime-details lifetime-storage-note"
    >
      <span class="section-label" id="lifetime-kicker"></span>
      <h2 id="lifetime-title"></h2>
      <p class="dialog-intro" id="lifetime-intro"></p>
      <div class="lifetime-offer" id="lifetime-offer">
        <strong id="lifetime-price"></strong>
        <span id="lifetime-price-note"></span>
      </div>
      <p id="lifetime-details"></p>
      <p class="lifetime-storage-note" id="lifetime-storage-note"></p>
      <p
        class="lifetime-status"
        id="lifetime-status"
        role="status"
        aria-live="polite"
      ></p>
      <div class="lifetime-dialog__actions">
        <button
          class="primary-button"
          id="lifetime-primary"
          type="button"
        ></button>
        <button class="control-button" id="lifetime-close" type="button"></button>
      </div>
    </dialog>

    <dialog
      class="result-dialog"
      id="result-dialog"
      aria-labelledby="result-title"
      aria-describedby="result-summary"
    >
      <span class="section-label" id="result-kicker">Run complete</span>
      <h2 id="result-title">Gate reached.</h2>
      <p id="result-summary"></p>
      <p class="result-access-note" id="result-access-note" hidden></p>
      <div
        class="result-atlas"
        id="result-atlas"
        role="group"
        aria-label="Echo Atlas progress"
      ></div>
      <div class="result-dialog__stats">
        <span><strong id="result-time">00:00</strong> time</span>
        <span><strong id="result-moves">000</strong> moves</span>
        <span><strong id="result-seed">SEED</strong> seed</span>
        <span><strong id="result-rank">PERSONAL #1</strong> standing</span>
      </div>
      <div class="result-dialog__actions">
        <button class="primary-button" id="replay-run" type="button">Continue Quest</button>
        <button class="control-button" id="fresh-run" type="button">New Quest</button>
      </div>
    </dialog>

    </template>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
