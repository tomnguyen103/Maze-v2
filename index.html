<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Echo Maze is a kid-friendly text adventure where clever answers defeat Wardens and open the way home."
    />
    <meta name="theme-color" content="#f8f4df" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23d9e500'/%3E%3Cpath d='M16 14h32v8H24v8h16v20H16v-8h16v-4H16z' fill='%230d1b2a'/%3E%3C/svg%3E"
    />
    <title>Echo Maze</title>
  </head>
  <body>
    <div id="game-root"></div>
    <template id="game-template">
    <a class="skip-link" href="#labyrinth">Skip to the Labyrinth</a>

    <nav class="command-bar" aria-label="Game controls">
      <a class="wordmark" href="#" aria-label="Echo Maze home">Echo Maze</a>
      <h1 id="quest-headline">Choose a quest. Outsmart the Wardens.</h1>
      <div class="command-bar__actions">
        <a class="control-link" id="classroom-link" href="/class" hidden>
          Classroom
        </a>
        <button class="control-button" id="daily-button" type="button">
          Daily
        </button>
        <button class="control-button" id="atlas-button" type="button">
          Atlas
        </button>
        <button class="control-button" id="workshop-button" type="button">
          Workshop
        </button>
        <button class="control-button" id="journal-button" type="button">
          Journal
        </button>
        <button class="control-button" id="records-button" type="button">
          Records
        </button>
        <button class="control-button" id="settings-button" type="button">
          Settings
        </button>
        <button class="control-button" id="sound-toggle" type="button" aria-pressed="false">
          Sound off
        </button>
        <button class="primary-button" id="new-run" type="button">
          New Quest
        </button>
      </div>
    </nav>

    <main class="play-workbench">
      <section class="play-grid" aria-label="Echo Maze game">
        <aside class="status-deck" aria-label="Run status">
          <div class="player-console" aria-label="Player status">
            <button class="player-console__identity" id="player-button" type="button">
              <span class="player-swatch" aria-hidden="true"></span>
              <span>
                <small>Explorer</small>
                <strong id="player-name">Guest</strong>
              </span>
            </button>
            <dl class="player-score">
              <div>
                <dt>Score</dt>
                <dd id="player-score">0</dd>
              </div>
              <div>
                <dt>Global max</dt>
                <dd id="global-max-score">—</dd>
              </div>
            </dl>
            <button class="scoreboard-button" id="scoreboard-button" type="button">
              Top 10
            </button>
          </div>

          <div class="status-deck__heading">
            <span class="section-label" id="quest-level-name">Trail Scout</span>
            <span class="run-state" id="run-state">Exploring</span>
          </div>
          <p class="quest-stage" id="quest-stage">
            Labyrinth 1 of 20 · Foundation
          </p>

          <p
            class="quest-sync-status"
            id="quest-sync-status"
            data-state="local"
            role="status"
            aria-live="polite"
          >
            Device save
          </p>

          <dl class="run-metrics">
            <div>
              <dt>Time</dt>
              <dd id="time-value">00:00</dd>
            </div>
            <div>
              <dt>Moves</dt>
              <dd id="moves-value">000</dd>
            </div>
            <div>
              <dt>Echoes</dt>
              <dd id="echo-count">0 / 3</dd>
            </div>
            <div>
              <dt>Vitality</dt>
              <dd id="vitality-count">3 / 3</dd>
            </div>
          </dl>

          <div class="meter-row">
            <span>Echo signal</span>
            <div class="echo-meter" id="echo-meter" aria-hidden="true"></div>
          </div>
          <div class="meter-row">
            <span>Vitality</span>
            <div class="vitality-meter" id="vitality-meter" aria-hidden="true"></div>
          </div>

          <div class="warden-readout" id="warden-readout" data-mode="patrol">
            <span class="section-label">Warden mode</span>
            <strong id="warden-state">Patrol</strong>
            <p id="warden-guild">Universal Warden marks</p>
          </div>
        </aside>

        <article class="labyrinth-panel" id="labyrinth">
          <div class="arena-bar">
            <button class="seed-copy" id="seed-copy" type="button">
              <span class="section-label">Seed</span>
              <strong id="seed-value"></strong>
              <span class="seed-copy__hint" id="seed-copy-hint">Copy Share Link</span>
            </button>
            <button class="control-button" id="pause-run" type="button" aria-pressed="false">
              Pause
            </button>
          </div>

          <div class="canvas-frame" id="canvas-frame">
            <canvas
              id="maze-canvas"
              width="720"
              height="720"
              tabindex="0"
              aria-label="Interactive maze. Use arrow keys or WASD to move. Press Q or Space to use Pulse."
            ></canvas>
          </div>

          <div class="arena-actions">
            <div class="touch-controls" aria-label="Touch movement controls">
              <button class="direction-button direction-button--up" data-move="up" type="button">
                <span aria-hidden="true">&uarr;</span><span class="sr-only">Move up</span>
              </button>
              <button class="direction-button direction-button--left" data-move="left" type="button">
                <span aria-hidden="true">&larr;</span><span class="sr-only">Move left</span>
              </button>
              <button class="direction-button direction-button--down" data-move="down" type="button">
                <span aria-hidden="true">&darr;</span><span class="sr-only">Move down</span>
              </button>
              <button class="direction-button direction-button--right" data-move="right" type="button">
                <span aria-hidden="true">&rarr;</span><span class="sr-only">Move right</span>
              </button>
            </div>

            <div class="trail-actions">
              <button class="pulse-button bell-button" id="bell-action" type="button" hidden>
                <span>
                  <strong>Ring Bell</strong>
                  <small>Lure revealed Wardens</small>
                </span>
                <kbd>B</kbd>
              </button>
              <button class="pulse-button" id="pulse-action" type="button">
                <span>
                  <strong>Pulse</strong>
                  <small>Reveal nearby tiles</small>
                </span>
                <kbd>Q</kbd>
                <span class="pulse-button__count" id="pulse-count">2</span>
              </button>
            </div>
          </div>

          <div class="event-ribbon" id="event-ribbon" aria-hidden="true">
            Run ready.
          </div>

          <details class="echo-lens" id="echo-lens" hidden>
            <summary>Why this works</summary>
            <div class="echo-lens__content" id="echo-lens-content"></div>
          </details>
        </article>

        <aside class="intel-deck" aria-label="How to play">
          <div>
            <span class="section-label">Your quest</span>
            <p class="objective-copy">
              Recover every Echo. When a Warden finds you, solve its challenge
              to clear the path. Then reach the open Gate.
            </p>
          </div>

          <div class="story-panel">
            <span class="section-label">Adventure log</span>
            <ol class="story-log" id="story-log"></ol>
          </div>

          <div class="legend" aria-label="Maze legend">
            <span class="section-label">Map marks</span>
            <ul>
              <li><span class="legend-mark legend-mark--explorer"></span>Explorer</li>
              <li><span class="legend-mark legend-mark--echo"></span>Echo</li>
              <li><span class="legend-mark legend-mark--gate-locked"></span>Locked Gate</li>
              <li><span class="legend-mark legend-mark--gate-sealed"></span>Open, sealed Gate</li>
              <li><span class="legend-mark legend-mark--gate-open"></span>Open Gate</li>
              <li><span class="legend-mark legend-mark--warden"></span>Warden</li>
              <li id="echo-bridge-legend" hidden><span class="legend-mark legend-mark--echo-bridge"></span>Echo Bridge: dashed sealed, solid open</li>
              <li id="tide-door-legend" hidden><span class="legend-mark legend-mark--tide-door"></span>Tide Doors: OPEN or SEALED together</li>
              <li id="signal-bell-legend" hidden><span class="legend-mark legend-mark--signal-bell"></span>Signal Bell: RING once while adjacent</li>
              <li id="windway-legend" hidden><span class="legend-mark legend-mark--windway"></span>Windway source → destination</li>
            </ul>
          </div>

          <p class="field-note" id="field-note">
            Explore with arrows or WASD. Your knowledge defeats Wardens.
          </p>
        </aside>
      </section>
    </main>

    <footer class="record-strip">
      <span class="record-strip__label">Run records</span>
      <p id="best-run">No finished run yet. Escape or defeat saves an attempt.</p>
    </footer>

    <p class="sr-only" id="live-region" aria-live="polite"></p>

    <dialog
      class="atlas-dialog"
      id="atlas-dialog"
      aria-labelledby="atlas-title"
      aria-describedby="atlas-progress atlas-legend"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">Quest Progress</span>
          <h2 id="atlas-title" tabindex="-1">Echo Atlas</h2>
        </div>
        <button class="control-button" id="atlas-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="atlas-progress"></p>
      <p class="atlas-legend" id="atlas-legend">
        Select any landmark for its field note. Diamond marks are Gate Warden
        milestones. Shift plus arrow keys pans the map.
      </p>
      <div class="atlas-mount" id="atlas-regions"></div>
    </dialog>

    <dialog
      class="access-settings-dialog"
      id="access-settings-dialog"
      aria-labelledby="access-settings-title"
      aria-describedby="access-settings-intro access-settings-status"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">Readable your way</span>
          <h2 id="access-settings-title" tabindex="-1">Explorer Access Settings</h2>
        </div>
      </div>
      <p class="dialog-intro" id="access-settings-intro">
        Changes preview right away. They change presentation only, never maze rules or score.
      </p>
      <section class="access-settings-preview" aria-labelledby="access-preview-title">
        <span class="section-label" id="access-preview-title">Live preview</span>
        <div class="access-maze-preview" aria-hidden="true">
          <span class="access-preview-pulse"></span>
          <span class="access-preview-mark access-preview-mark--explorer"></span>
          <span class="access-preview-mark access-preview-mark--echo"></span>
          <span class="access-preview-mark access-preview-mark--gate"></span>
          <span class="access-preview-mark access-preview-mark--warden"></span>
        </div>
        <p class="access-question-preview">
          Question preview: What is 7 + 5?
        </p>
        <p class="access-answer-preview" aria-label="Sample answer: 12">
          <span aria-hidden="true">A</span>
          <strong aria-hidden="true">12</strong>
        </p>
      </section>
      <form class="access-settings-form" id="access-settings-form">
        <fieldset class="access-settings-list">
          <legend class="sr-only">Presentation settings</legend>
          <label class="access-setting">
            <input id="access-high-contrast" name="highContrast" type="checkbox" />
            <span>
              <strong>Stronger Fog contrast</strong>
              <small>Separates hidden Fog, open passages, and walls more clearly.</small>
            </span>
          </label>
          <label class="access-setting">
            <input id="access-large-marks" name="largeMarks" type="checkbox" />
            <span>
              <strong>Larger maze marks</strong>
              <small>Enlarges Explorer, Echo, Gate, and Warden shapes.</small>
            </span>
          </label>
          <label class="access-setting">
            <input id="access-reader-type" name="readerFriendlyQuestions" type="checkbox" />
            <span>
              <strong>Reader-friendly Question text</strong>
              <small>Uses calmer spacing and the body typeface for Questions.</small>
            </span>
          </label>
          <label class="access-setting">
            <input id="access-reduced-effects" name="reducedEffects" type="checkbox" />
            <span>
              <strong>Reduce visual effects</strong>
              <small>Your device reduced-motion preference is always respected.</small>
            </span>
          </label>
        </fieldset>
        <p
          class="access-settings-status"
          id="access-settings-status"
          role="status"
          aria-live="polite"
        ></p>
        <div class="access-settings-actions">
          <button class="primary-button" id="access-settings-save" type="submit">
            Save settings
          </button>
          <button class="control-button" id="access-settings-reset" type="button">
            Reset to defaults
          </button>
          <button class="control-button" id="access-settings-close" type="button">
            Cancel
          </button>
        </div>
      </form>
    </dialog>

    <dialog
      class="first-light-dialog"
      id="first-light-dialog"
      aria-labelledby="first-light-title"
      aria-describedby="first-light-intro first-light-boundary"
    >
      <span class="section-label">A one-maze lesson</span>
      <h2 id="first-light-title" tabindex="-1">Your First Light</h2>
      <p class="dialog-intro" id="first-light-intro">
        The first Echo is waiting at the edge of a waking Labyrinth.
        Recover it, answer one Warden, and reach the Gate with the same
        rules every Quest uses.
      </p>
      <ol class="first-light-route" aria-label="First Light route">
        <li><strong>Move</strong><span>Find one Echo.</span></li>
        <li><strong>Think</strong><span>Use a Hint, then answer.</span></li>
        <li><strong>Escape</strong><span>Reach the open Gate.</span></li>
      </ol>
      <p class="first-light-boundary" id="first-light-boundary">
        Practice only. First Light never saves Quest progress, Journal
        notes, Atlas marks, scores, Run Records, or access.
      </p>
      <div class="first-light-dialog__actions">
        <button class="primary-button" id="first-light-start" type="button">
          Start First Light
        </button>
        <button class="control-button" id="first-light-skip" type="button">
          Skip to Quest
        </button>
      </div>
    </dialog>

    <dialog class="level-dialog" id="level-dialog" aria-labelledby="level-title">
      <div class="level-dialog__intro">
        <span class="section-label">Start an adventure</span>
        <h2 id="level-title" tabindex="-1">Choose your Quest Level</h2>
        <p>Every path has a different maze and learning challenge. Choose a Learning Deck below, then pick a level to start the Quest. You can change both whenever you start a new quest.</p>
      </div>
      <fieldset
        class="learning-deck-picker"
        aria-describedby="learning-deck-guidance"
      >
        <legend>Choose a Learning Deck</legend>
        <p id="learning-deck-guidance">
          Pick the reviewed Question mix for this Quest. It never changes maze
          difficulty, access, score, or Warden rules.
        </p>
        <div class="learning-deck-options" id="learning-deck-options"></div>
      </fieldset>
      <div class="level-cards" id="level-cards">
        <button class="level-card" type="button" data-level="bright-start">
          <span class="level-card__badge">Quest Level 1</span>
          <strong>Bright Start</strong>
          <span>Friendly foundations across 20 growing Labyrinths.</span>
          <span class="level-card__topics">Questions: sums to 20 · words · nature</span>
          <small>11–15 tiles · 2–4 Echoes · 1–3 Wardens</small>
        </button>
        <button class="level-card level-card--featured" type="button" data-level="trail-scout">
          <span class="level-card__badge">Quest Level 2</span>
          <strong>Trail Scout</strong>
          <span>Balanced reasoning across 20 expanding Labyrinths.</span>
          <span class="level-card__topics">Questions: times tables · reading clues · life science</span>
          <small>13–19 tiles · 3–6 Echoes · 2–4 Wardens</small>
        </button>
        <button class="level-card" type="button" data-level="maze-master">
          <span class="level-card__badge">Quest Level 3</span>
          <strong>Maze Master</strong>
          <span>Advanced mastery across 20 formidable Labyrinths.</span>
          <span class="level-card__topics">Questions: fractions · logic · earth and space</span>
          <small>15–23 tiles · 4–8 Echoes · 3–6 Wardens</small>
        </button>
      </div>
      <div class="level-dialog__first-light">
        <p>
          Want the short lesson again? First Light always stays available
          and never changes Quest progress.
        </p>
        <button class="control-button" id="first-light-replay" type="button">
          Replay First Light
        </button>
      </div>
      <p class="level-dialog__note">No timer during questions. Take your time and think.</p>
    </dialog>

    <dialog
      class="quest-conflict-dialog"
      id="quest-conflict-dialog"
      aria-labelledby="quest-conflict-title"
      aria-describedby="quest-conflict-intro"
    >
      <span class="section-label">Quest continuity</span>
      <h2 id="quest-conflict-title" tabindex="-1">Choose which Quest to keep</h2>
      <p class="dialog-intro" id="quest-conflict-intro"></p>
      <div class="quest-conflict-options">
        <section class="quest-conflict-choice" id="quest-conflict-local"></section>
        <section class="quest-conflict-choice" id="quest-conflict-cloud"></section>
      </div>
      <div class="quest-conflict-dialog__actions">
        <button
          class="control-button"
          id="quest-conflict-use-local"
          type="button"
        >
          Keep this device
        </button>
        <button
          class="primary-button"
          id="quest-conflict-use-cloud"
          type="button"
        >
          Use Cloud Quest
        </button>
      </div>
    </dialog>

    <dialog
      class="daily-dialog"
      id="daily-dialog"
      aria-labelledby="daily-title"
      aria-describedby="daily-intro daily-boundary daily-record"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">One maze · every Explorer</span>
          <h2 id="daily-title" tabindex="-1">Daily Shared Labyrinth</h2>
        </div>
        <button class="control-button" id="daily-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="daily-intro">
        Everyone gets the same maze and reviewed Questions. Signed-in escapes
        can join the Verified Daily Board after a server replay. Your Quest,
        Atlas, Run Access, and Casual Global Scoreboard never change.
      </p>
      <div class="daily-contract" aria-label="Today’s Daily details">
        <span class="section-label">Today in UTC</span>
        <strong id="daily-date"></strong>
        <span>Trail Scout · Labyrinth 5 · Developing</span>
      </div>
      <p class="daily-expired" id="daily-expired" role="status" hidden></p>
      <p id="daily-boundary">
        A Daily begins and expires at 00:00 UTC. Old links offer today’s maze
        instead of replaying an expired one.
      </p>
      <p class="daily-record" id="daily-record"></p>
      <section
        class="daily-board"
        aria-labelledby="daily-board-title"
        aria-describedby="daily-board-status daily-board-note"
      >
        <div class="daily-board__heading">
          <h3 id="daily-board-title">Verified Daily Board</h3>
          <span id="daily-board-date"></span>
        </div>
        <p
          class="daily-board__status"
          id="daily-board-status"
          role="status"
          aria-live="polite"
          aria-label="Verified Daily Board status"
        >
          Loading verified escapes…
        </p>
        <ol
          class="daily-board__list"
          id="daily-board-list"
          aria-label="Verified Daily Board"
        ></ol>
        <button
          class="control-button daily-board__retry"
          id="daily-board-retry"
          type="button"
          hidden
        >
          Retry verified board
        </button>
        <p class="daily-board__note" id="daily-board-note"></p>
      </section>
      <div class="daily-dialog__actions">
        <button class="primary-button" id="daily-start" type="button">
          Start today’s Daily
        </button>
        <button class="control-button" id="daily-copy" type="button">
          Copy today’s link
        </button>
        <button class="control-button" id="daily-return" type="button">
          Return to Quest
        </button>
      </div>
    </dialog>

    <dialog
      class="challenge-dialog"
      id="challenge-dialog"
      aria-labelledby="challenge-title"
      aria-describedby="challenge-promise challenge-feedback challenge-notice challenge-question"
    >
      <div class="challenge-dialog__crest" aria-hidden="true">?</div>
      <span class="section-label" id="challenge-kicker">Warden challenge</span>
      <h2 id="challenge-title">A Warden blocks the path.</h2>
      <p class="challenge-dialog__promise" id="challenge-promise">Answer correctly and the Warden is defeated.</p>
      <button
        class="control-button"
        id="gate-staging-skip"
        type="button"
        hidden
      >
        Skip entrance
      </button>
      <div class="challenge-feedback" id="challenge-feedback" role="status">
        Think carefully. Your timer is paused.
      </div>
      <p class="challenge-notice" id="challenge-notice" hidden></p>
      <p
        class="challenge-question"
        id="challenge-question"
        tabindex="-1"
        aria-live="polite"
        aria-atomic="true"
      >Preparing your question…</p>
      <div class="challenge-support">
        <button
          class="control-button"
          id="hint-button"
          type="button"
          aria-expanded="false"
          aria-controls="question-hint"
        >
          Show Hint
        </button>
        <p class="question-hint" id="question-hint" aria-live="polite" hidden></p>
      </div>
      <div class="challenge-choices" id="challenge-choices"></div>
      <div class="challenge-skip">
        <button class="control-button" id="skip-question" type="button">
          Skip free
        </button>
        <div class="skip-warning" id="skip-warning" role="alert" hidden>
          <strong>Use Vitality?</strong>
          <p id="skip-warning-text">Skipping costs 1 Vitality.</p>
          <div class="skip-warning__actions">
            <button class="control-button" id="skip-cancel" type="button">
              Keep question
            </button>
            <button class="danger-button" id="skip-confirm" type="button">
              Use skip
            </button>
          </div>
        </div>
      </div>
      <p class="challenge-source" id="challenge-source">Opening the question scroll…</p>
      <section class="challenge-lens-panel" id="challenge-lens-panel" hidden>
        <details class="echo-lens" id="challenge-echo-lens">
          <summary>Why this works</summary>
          <div
            class="echo-lens__content"
            id="challenge-echo-lens-content"
          ></div>
        </details>
        <button
          class="primary-button"
          id="challenge-echo-lens-continue"
          type="button"
        >
          Next question
        </button>
      </section>
    </dialog>

    <dialog
      class="journal-dialog"
      id="journal-dialog"
      aria-labelledby="journal-title"
      aria-describedby="journal-intro journal-status"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">Lantern Journal</span>
          <h2 id="journal-title">What you have practiced</h2>
        </div>
        <button class="control-button" id="journal-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="journal-intro">
        Review learning goals by difficulty band. The Journal saves Question
        topics and coarse outcomes, never typed answers or a child profile.
      </p>
      <p class="journal-status" id="journal-status" role="status" aria-live="polite"></p>
      <div class="journal-bands" id="journal-bands"></div>
      <div class="journal-clear">
        <button class="control-button" id="journal-clear" type="button">
          Clear Journal
        </button>
        <div class="journal-clear__warning" id="journal-clear-warning" role="alert" hidden>
          <strong>Clear every Journal entry?</strong>
          <p>This removes local entries now. Signed-in cloud entries are also removed.</p>
          <div class="journal-clear__actions">
            <button class="control-button" id="journal-clear-cancel" type="button">
              Keep Journal
            </button>
            <button class="danger-button" id="journal-clear-confirm" type="button">
              Clear now
            </button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog
      class="practice-dialog"
      id="practice-dialog"
      aria-labelledby="practice-title"
      aria-describedby="practice-promise practice-feedback"
    >
      <span class="section-label">Optional · unscored</span>
      <h2 id="practice-title" tabindex="-1">Lantern Trail Workshop</h2>
      <p class="dialog-intro" id="practice-promise">
        No timer, score, Vitality, access, or Quest progress changes here.
      </p>
      <section class="practice-catalog" id="practice-catalog">
        <div class="practice-catalog__heading">
          <h3>Choose a learning goal</h3>
          <p id="practice-catalog-summary"></p>
        </div>
        <div class="practice-objectives" id="practice-objectives"></div>
      </section>
      <section class="practice-trail" id="practice-trail" hidden>
        <div class="practice-trail__heading">
          <p class="section-label" id="practice-progress"></p>
          <h3 id="practice-objective-label"></h3>
        </div>
        <p class="practice-question" id="practice-question" tabindex="-1"></p>
        <div class="practice-support">
          <button
            class="control-button"
            id="practice-hint-button"
            type="button"
            aria-expanded="false"
            aria-controls="practice-hint"
          >
            Show Hint
          </button>
          <p id="practice-hint" aria-live="polite" hidden></p>
        </div>
        <div class="practice-choices" id="practice-choices"></div>
        <p
          class="practice-feedback"
          id="practice-feedback"
          role="status"
          aria-live="polite"
        ></p>
        <div class="practice-trail__actions">
          <button class="control-button" id="practice-skip" type="button">
            Skip Lantern
          </button>
          <button class="primary-button" id="practice-next" type="button" hidden>
            Next Lantern
          </button>
          <button class="control-button" id="practice-keep" type="button" hidden>
            Keep Practicing
          </button>
        </div>
      </section>
      <section class="practice-completion" id="practice-completion" hidden>
        <p class="section-label">Trail complete</p>
        <h3>Lantern Trail complete</h3>
        <p id="practice-completion-copy"></p>
        <button class="control-button" id="practice-choose" type="button">
          Choose another Trail
        </button>
      </section>
      <div class="practice-dialog__destinations">
        <button class="control-button" id="practice-journal" type="button">
          Open Journal
        </button>
        <button class="control-button" id="practice-atlas" type="button">
          Open Atlas
        </button>
        <button class="control-button" id="practice-close" type="button">
          Return to Play
        </button>
      </div>
    </dialog>

    <dialog class="records-dialog" id="records-dialog" aria-labelledby="records-title">
      <div class="dialog-heading">
        <div>
          <span class="section-label">Saved locally</span>
          <h2 id="records-title">Run Records</h2>
        </div>
        <button class="control-button" id="records-close" type="button">Close</button>
      </div>
      <p class="dialog-intro">
        Your five strongest finished attempts. Escapes rank first; defeats show
        Echo progress. Replay or share any seed.
      </p>
      <ol class="run-records" id="run-records"></ol>
    </dialog>

    <dialog class="player-dialog" id="player-dialog" aria-labelledby="player-dialog-title">
      <div class="dialog-heading">
        <div>
          <span class="section-label">Explorer profile</span>
          <h2 id="player-dialog-title">Make the maze yours.</h2>
        </div>
        <button class="control-button" id="player-close" type="button">Close</button>
      </div>
      <p class="dialog-intro" id="player-dialog-intro">
        Sign in to save a username, colors, and escaped-run scores.
      </p>
      <div class="player-auth-row">
        <button class="primary-button" id="player-auth-button" type="button">
          Sign in
        </button>
        <button class="control-button" id="player-sign-out" type="button" hidden>
          Sign out
        </button>
      </div>
      <form class="player-form" id="player-form">
        <label class="player-field" for="player-username">
          <span>Username</span>
          <input
            id="player-username"
            name="username"
            type="text"
            minlength="3"
            maxlength="20"
            autocomplete="username"
            placeholder="Moss Runner"
            required
          />
          <small>3–20 letters, numbers, spaces, underscores, or hyphens.</small>
        </label>
        <fieldset class="palette-fieldset">
          <legend>Explorer color</legend>
          <div class="palette-options palette-options--explorer">
            <label><input type="radio" name="explorerPalette" value="teal" checked /><span data-palette="teal">Signal teal</span></label>
            <label><input type="radio" name="explorerPalette" value="sunset" /><span data-palette="sunset">Sunset coral</span></label>
            <label><input type="radio" name="explorerPalette" value="violet" /><span data-palette="violet">Quest violet</span></label>
            <label><input type="radio" name="explorerPalette" value="gold" /><span data-palette="gold">Lantern gold</span></label>
          </div>
        </fieldset>
        <fieldset class="palette-fieldset">
          <legend>Playground color</legend>
          <div class="palette-options palette-options--playground">
            <label><input type="radio" name="playgroundPalette" value="daylight" checked /><span data-palette="daylight">Daylight</span></label>
            <label><input type="radio" name="playgroundPalette" value="twilight" /><span data-palette="twilight">Twilight</span></label>
            <label><input type="radio" name="playgroundPalette" value="sea-glass" /><span data-palette="sea-glass">Sea glass</span></label>
            <label><input type="radio" name="playgroundPalette" value="dusk" /><span data-palette="dusk">Dusk</span></label>
          </div>
        </fieldset>
        <p class="player-form__status" id="player-form-status" role="status" aria-live="polite"></p>
        <button class="primary-button" id="player-save" type="submit">
          Save profile
        </button>
      </form>
    </dialog>

    <dialog
      class="scoreboard-dialog"
      id="scoreboard-dialog"
      aria-labelledby="scoreboard-title"
    >
      <div class="dialog-heading">
        <div>
          <span class="section-label">All Explorers</span>
          <h2 id="scoreboard-title">Casual Global Scoreboard</h2>
        </div>
        <button class="control-button" id="scoreboard-close" type="button">Close</button>
      </div>
      <p class="dialog-intro">
        Best escaped runs from the compatibility score path. These scores are
        casual, not server-replayed. Warden 100 · Echo 50 · Escape 500.
      </p>
      <label class="scoreboard-partition" for="scoreboard-partition">
        Scoreboard rules
        <select id="scoreboard-partition"></select>
      </label>
      <p id="scoreboard-partition-label" class="scoreboard-partition__label"></p>
      <p class="scoreboard-status" id="scoreboard-status" role="status" aria-live="polite">
        Loading scores…
      </p>
      <ol class="scoreboard-list" id="scoreboard-list"></ol>
    </dialog>

    <dialog
      class="lifetime-dialog"
      id="lifetime-dialog"
      aria-labelledby="lifetime-title"
      aria-describedby="lifetime-intro lifetime-details lifetime-storage-note"
    >
      <span class="section-label" id="lifetime-kicker"></span>
      <h2 id="lifetime-title"></h2>
      <p class="dialog-intro" id="lifetime-intro"></p>
      <div class="lifetime-offer" id="lifetime-offer">
        <strong id="lifetime-price"></strong>
        <span id="lifetime-price-note"></span>
      </div>
      <p id="lifetime-details"></p>
      <p class="lifetime-storage-note" id="lifetime-storage-note"></p>
      <p
        class="lifetime-status"
        id="lifetime-status"
        role="status"
        aria-live="polite"
      ></p>
      <div class="lifetime-dialog__actions">
        <button
          class="primary-button"
          id="lifetime-primary"
          type="button"
        ></button>
        <button class="control-button" id="lifetime-close" type="button"></button>
      </div>
    </dialog>

    <dialog
      class="result-dialog"
      id="result-dialog"
      aria-labelledby="result-title"
      aria-describedby="result-summary"
    >
      <span class="section-label" id="result-kicker">Run complete</span>
      <h2 id="result-title" tabindex="-1">Gate reached.</h2>
      <p id="result-summary"></p>
      <p class="result-access-note" id="result-access-note" hidden></p>
      <div
        class="result-atlas"
        id="result-atlas"
        role="group"
        aria-label="Echo Atlas progress"
      ></div>
      <div class="result-dialog__stats">
        <span><strong id="result-time">00:00</strong> time</span>
        <span><strong id="result-moves">000</strong> moves</span>
        <span><strong id="result-seed">SEED</strong> seed</span>
        <span><strong id="result-rank">PERSONAL #1</strong> standing</span>
      </div>
      <div class="result-dialog__actions">
        <button class="control-button" id="result-practice" type="button" hidden>Practice</button>
        <button class="primary-button" id="replay-run" type="button">Continue Quest</button>
        <button class="control-button" id="fresh-run" type="button">New Quest</button>
      </div>
    </dialog>

    </template>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
